# Netlify reads this when the site's base directory is finance-app (docs/DEPLOY.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The single-page app: anything that isn't a file or an /api route serves index.html.
# Functions with a path (netlify/functions/api.mts serves /api/*) take precedence over this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# These apply to the static site only; API responses set no-store and nosniff in code (server/cloud/http.ts).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
